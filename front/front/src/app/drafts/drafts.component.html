<!-- ================= NEW DRAFT CARD ================= -->
<mat-card class="draft-card">
  <h2>Create Draft</h2>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Name</mat-label>
    <input matInput [(ngModel)]="newDraft.name">
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Definition</mat-label>
    <textarea matInput rows="3" [(ngModel)]="newDraft.definition"></textarea>
  </mat-form-field>

  <button mat-raised-button color="primary" (click)="createDraft()">
    Create
  </button>
</mat-card>

<!-- ================= TABLE ================= -->
<mat-card class="table-card">
  <table mat-table [dataSource]="drafts" class="mat-elevation-z2">

    <!-- Name -->
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef>Name</th>
      <td mat-cell *matCellDef="let row">{{ row.name }}</td>
    </ng-container>

    <!-- Definition -->
    <ng-container matColumnDef="definition">
      <th mat-header-cell *matHeaderCellDef>Definition</th>
      <td mat-cell *matCellDef="let row">{{ row.definition }}</td>
    </ng-container>

    <!-- Actions -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let row">

        <button mat-icon-button color="accent" (click)="startEdit(row)">
          <mat-icon>edit</mat-icon>
        </button>

        <button mat-icon-button color="warn" (click)="deleteDraft(row.id)">
          <mat-icon>delete</mat-icon>
        </button>

        <button mat-icon-button color="primary" (click)="publishDraft(row.id)">
          <mat-icon>publish</mat-icon>
        </button>

      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</mat-card>

<!-- ================= EDIT FORM ================= -->
<mat-card *ngIf="editDraft" class="draft-card">
  <h2>Edit Draft</h2>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Name</mat-label>
    <input matInput [(ngModel)]="editDraft.name">
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Definition</mat-label>
    <textarea matInput rows="3" [(ngModel)]="editDraft.definition"></textarea>
  </mat-form-field>

  <button mat-raised-button color="primary" (click)="updateDraft()">Save</button>
  <button mat-button (click)="cancelEdit()">Cancel</button>
</mat-card>
