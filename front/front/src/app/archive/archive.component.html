<div class="search-container">
  <mat-form-field appearance="outline" class="search-field">
    <mat-label>Search Archived Terms</mat-label>
    <input matInput [formControl]="searchControl" placeholder="Enter term name">
  </mat-form-field>
</div>

<div class="table-container">
  <table mat-table [dataSource]="filteredTerms" class="mat-elevation-z1">

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Term Name </th>
      <td mat-cell *matCellDef="let term">
        <span class="term-name">{{ term.name }}</span>
      </td>
    </ng-container>

    <ng-container matColumnDef="definition">
      <th mat-header-cell *matHeaderCellDef> Definition </th>
      <td mat-cell *matCellDef="let term"> {{ term.definition }} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <div *ngIf="filteredTerms.length === 0" class="no-results">
    No archived terms found.
  </div>
</div>
